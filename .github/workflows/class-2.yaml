---
name: Deploy to server
'on': push
jobs:
  first_jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Send message
        id: step_1
        run: echo "my_variable=Alex" >> $GITHUB_OUTPUT

      - name: Print message
        run: echo ${{ steps.step_1.outputs.my_variable }}

  second_jobs:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: first_jobs
    runs-on: ubuntu-latest
    env:
      NAME: Alex
    steps:
      - name: Hello world
        run: echo "hello world! ${{ github.ref }}, $NAME"