name: Deploy to server

on: push

jobs:
  first_jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Hello world
        run: echo "hello world!"
  
  second_jobs:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: first_jobs
    runs-on: ubuntu-latest
    
    env:
      NAME: Alex

    steps:
      - name: Hello world
        run: echo "hello world! ${{ github.ref }}, $NAME"
