name: Deploy

on:
  push:
    branches:
    - "class-3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Print variable
      run: echo "${{ secrets.TOKEN_SECRET }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test

    - name: Build page
      run: npm run build

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: deploy
      id: deployment
      uses: actions/deploy-pages@v4
